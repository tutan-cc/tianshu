<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 麻将桌（three.js 预览）</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0f10; overflow: hidden;
    font-family: "Microsoft YaHei", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #hud { position: fixed; left: 16px; top: 14px; color: #e8f2ee; font-size: 14px;
    line-height: 1.7; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; }
  #hud b { color: #ffd966; font-weight: 600; }
  #bar { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 10px; }
  button { background: #1c3a34; color: #d9f2e8; border: 1px solid #2f6b5d;
    border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer; }
  button:hover { background: #265045; }
  #tip { position: fixed; right: 16px; bottom: 16px; color: #6f8b84; font-size: 12px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <div><b>3D 麻将桌</b> · three.js 预览</div>
  <div id="info">牌墙 0 张</div>
  <div id="diag" style="font-size:12px;color:#8fd0c0;margin-top:6px"></div>
</div>
<div id="bar">
  <button onclick="MJ3D.reset()">重新发牌</button>
</div>
<div id="tip">拖动旋转视角 · 滚轮缩放</div>

<script src="three.min.js"></script>
<script src="mahjong.gl3d.js"></script>
<script>
  var stage = document.getElementById('stage');
  MJ3D.init(stage);
  function syncInfo() {
    var s = MJ3D.state();
    document.getElementById('info').textContent = '牌墙 ' + s.wall + ' 张 · 手牌 ' + s.hands[0].length + ' 张';
  }
  syncInfo();
  (function () {
    try {
      var d = MJ3D.diag();
      document.getElementById('diag').textContent =
        'three r' + d.revision + ' · WebGL2=' + d.webgl2 + ' · 灯=' + d.lights +
        ' · felt=' + d.feltColor + '(' + d.feltType + ')' +
        ' · 墙=' + d.wallTiles + ' 手=' + d.handTiles + ' 河=' + d.discTiles;
    } catch (e) {
      document.getElementById('diag').textContent = 'DIAG ERR: ' + e.message;
    }
  })();
  document.querySelector('button').addEventListener('click', function () {
    setTimeout(syncInfo, 30);
  });
</script>
</body>
</html>
