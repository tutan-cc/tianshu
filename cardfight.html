<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡牌对决 · 12 卡 5 轮</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   卡牌对决 —— 单文件、零依赖、双击即玩
   设计说明：
   · 整页用 #stage 设计成固定 1280×860 的"设计画布"，再用 transform: scale()
     等比缩放到窗口 —— 这是"屏幕大小变化时整体缩放适配"的实现方式（见 fitStage）。
     比满屏 flex 稳：所有动画的像素位移在任何窗口尺寸下都一致，不会这边挤出重叠。
   · 卡牌是 CSS 3D 翻转（.card > .inner，rotateY 180°），不是换图片。
   · 抽牌用 FLIP：克隆卡背 → 记下起点/终点矩形 → 用 transform 飞过去 → 落位时换成真卡。
   ═══════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08060f}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
  /* 背景：三团径向光 + 深底，营造"地下拳台"的氛围 */
  background:
    radial-gradient(ellipse 70% 55% at 22% 18%, rgba(90,60,180,.42), transparent 62%),
    radial-gradient(ellipse 65% 55% at 80% 80%, rgba(200,50,110,.30), transparent 62%),
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(40,120,200,.16), transparent 70%),
    #08060f;
  -webkit-font-smoothing:antialiased;
}
#stage{width:1280px;height:860px;position:relative;flex:0 0 auto;transform-origin:center center}

/* ── 通用卡片外观 ───────────────────────────────────────────────── */
.card{
  position:absolute;width:var(--cw);height:var(--ch);
  perspective:900px;           /* 3D 翻转的视距：太小会畸变，太大就没有立体感 */
  transition:transform .18s ease, filter .18s ease, opacity .18s ease;
}
.card .inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.1,.2,1);
}
.card.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:10px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
/* 卡背：深紫底 + 斜纹 + 金菱徽记 */
.back{
  background:linear-gradient(145deg,#2b2050,#171029 55%,#2b2050);
  border:2px solid #0a0714;
  box-shadow:inset 0 0 0 1px rgba(255,215,110,.28), 0 6px 16px rgba(0,0,0,.55);
}
.back::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,rgba(140,110,255,.16) 0 6px,transparent 6px 14px);
}
.back::after{
  content:"◆";position:absolute;font-size:calc(var(--cw) * .34);
  color:#ffd76e;text-shadow:0 0 14px rgba(255,215,110,.7);
}
/* 卡面：浅色 + 类型色描边（--c 由 JS 按卡牌类型写入） */
.front{
  transform:rotateY(180deg);
  background:linear-gradient(170deg,#f6ecf3,#e2cee0 60%,#cfb6cc);
  border:2px solid #0a0714;
  box-shadow:inset 0 0 0 2px var(--c), 0 6px 16px rgba(0,0,0,.55);
  padding:6px 4px;
  gap:2px;
}
.front .ico{font-size:calc(var(--cw) * .30);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.front .nm{font-size:calc(var(--cw) * .115);font-weight:800;color:#1c1424;letter-spacing:.5px}
.front .vl{
  font-size:calc(var(--cw) * .125);font-weight:900;color:#1c1424;
  background:#ffd76e;border-radius:99px;padding:1px 8px;
  box-shadow:0 2px 5px rgba(0,0,0,.22);
}
.front .ds{
  font-size:calc(var(--cw) * .082);color:#4a3c52;line-height:1.28;text-align:center;
  padding:0 3px;max-height:2.6em;overflow:hidden;
}
.front .tag{
  position:absolute;top:4px;left:4px;
  font-size:calc(var(--cw) * .078);font-weight:800;color:#fff;
  background:var(--c);border-radius:99px;padding:1px 6px;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}

/* ── 开场：双方对峙 + VS ────────────────────────────────────────── */
#opening{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#opening.hide{opacity:0;pointer-events:none;transition:opacity .5s ease}
.duel{display:flex;align-items:center;gap:70px}
.fighter-big{display:flex;flex-direction:column;align-items:center;gap:10px}
.avatar{
  width:190px;height:190px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:104px;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.16),rgba(0,0,0,.4));
  border:3px solid var(--c);
  box-shadow:0 0 34px var(--glow), inset 0 0 30px rgba(0,0,0,.5);
  animation:float 3.2s ease-in-out infinite;
}
.fighter-big.right .avatar{animation-delay:-1.6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.fighter-big .nm-big{font-size:22px;font-weight:800;color:#fff;letter-spacing:2px}
.fighter-big .hp-big{font-size:13px;color:#a99fc4;letter-spacing:1px}
/* 从两侧滑入 */
.from-left{animation:slideL .7s cubic-bezier(.2,.9,.25,1) both}
.from-right{animation:slideR .7s cubic-bezier(.2,.9,.25,1) both}
@keyframes slideL{from{transform:translateX(-360px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(360px);opacity:0}to{transform:none;opacity:1}}
#vs{
  font-size:96px;font-weight:900;font-style:italic;letter-spacing:-4px;
  background:linear-gradient(180deg,#fff6c9,#ffb03a 55%,#ff4d6d);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(255,120,60,.6);
  animation:vsIn .55s cubic-bezier(.2,1.6,.4,1) .45s both;
}
@keyframes vsIn{from{transform:scale(3.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
/* 开场那圈冲击波 */
#vsRing{
  position:absolute;width:340px;height:340px;border-radius:50%;
  border:3px solid rgba(255,180,80,.75);opacity:0;
  animation:ring 1s ease-out .5s 2;
}
@keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(2.1);opacity:0}}

/* ── 战斗 HUD ───────────────────────────────────────────────────── */
#battle{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease}
#battle.on{opacity:1;pointer-events:auto}
.hud{position:absolute;top:16px;display:flex;flex-direction:column;gap:6px;width:470px}
.hud.left{left:26px}
.hud.right{right:26px;align-items:flex-end}
.hud .row{display:flex;align-items:center;gap:10px}
.hud.right .row{flex-direction:row-reverse}
.hud .av{
  width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:30px;background:rgba(255,255,255,.07);border:2px solid var(--c);flex:0 0 auto;
}
.hud .meta{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.hud.right .meta{align-items:flex-end}
.hud .who{font-size:15px;font-weight:800;color:#fff;letter-spacing:1px}
/* 血条：用内层宽度过渡实现平滑变化 */
.bar{position:relative;width:100%;height:16px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;
     box-shadow:inset 0 1px 4px rgba(0,0,0,.6)}
.bar > i{position:absolute;inset:0;transform-origin:left center;border-radius:99px;
     transition:transform .55s cubic-bezier(.3,.9,.3,1), background .3s}
.hud.right .bar > i{transform-origin:right center}
.bar > i.hp{background:linear-gradient(90deg,#5dffa0,#28c46a)}
.bar > i.hp.low{background:linear-gradient(90deg,#ff6b6b,#c42b2b)}
/* 护盾条：叠在血条上方的一条细带 */
.shbar{position:relative;width:100%;height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.shbar > i{position:absolute;inset:0;transform-origin:left center;border-radius:99px;
     background:linear-gradient(90deg,#8fd8ff,#3aa9ff);transition:transform .45s cubic-bezier(.3,.9,.3,1)}
.hud.right .shbar > i{transform-origin:right center}
.hud .num{font-size:13px;color:#cdc4e2;font-variant-numeric:tabular-nums}
.hud .num b{color:#fff;font-size:16px}
#roundTag{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  text-align:center;color:#fff;
}
#roundTag .r{font-size:26px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#roundTag .s{font-size:12px;color:#a99fc4;letter-spacing:3px;margin-top:2px}
/* 蓄力/减疗之类的状态标记 */
.badges{position:absolute;top:96px;display:flex;gap:6px}
.badges.left{left:26px}
.badges.right{right:26px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;
  background:rgba(255,215,110,.16);border:1px solid rgba(255,215,110,.5);color:#ffd76e;
  animation:pop .3s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* ── 中央牌堆：12 张卡背（2 列 × 6 行，贴右侧中部）────────────────
   ⚠ 必须用 grid 而不是 flex-wrap：flex 下"一行放得下几张"取决于像素计算，
     宽度一顶到上限就断出残行（实测 6+3，第二行压在卡槽上）。grid 锁死列数则无关。
   ⚠ 卡背尺寸必须等于 3D 翻转用的 .card 尺寸（--cw/--ch）：背面是 inset:0 撑满、
     正面按 --cw 算字号，两者不一致时翻面会看到尺寸跳变。
   ⚠ 纵向位置要避开右上角的对手 HUD（血条+名字占到 y≈95）——
     贴 top:14 时会压在"赤鬼 / 生命 60"上面（实测截图确认过）。 */
#deck{position:absolute;right:12px;top:104px;z-index:14;
      display:grid;grid-template-columns:repeat(2,66px);grid-auto-rows:92px;
      gap:6px 8px;place-content:center;transition:opacity .35s}
#deck.gone{opacity:0}
#deck .card{position:relative;width:66px;height:92px;--cw:66px;--ch:92px}
/* 牌堆里的卡背**是可点的**（玩家自己抽），所以必须有可点的反馈：
   悬停上浮 + 金色描边 + 手型光标；已抽走的那张淡出并立刻停止接收点击。 */
#deck .card.pickable{cursor:pointer}
#deck .card.pickable:hover{transform:translateY(-7px) scale(1.07);filter:brightness(1.25)}
#deck .card.pickable:hover .back{box-shadow:inset 0 0 0 2px rgba(255,215,110,.95), 0 8px 20px rgba(0,0,0,.6)}
#deck .card.picked{opacity:0;transform:scale(.7);transition:opacity .25s, transform .25s;pointer-events:none}
/* 空着的卡槽在"抽牌阶段"要更显眼，让玩家知道牌会落到哪里 */
.slot.waiting{border-color:rgba(255,215,110,.4);background:rgba(255,215,110,.05)}
#deckPile{position:absolute;right:6px;top:694px;width:152px;text-align:center;
      font-size:11px;color:#a99fc4;letter-spacing:.5px;line-height:1.45}

/* ── 人物战场（canvas）─────────────────────────────────────────────
   延用打斗 2.0 的立绘与侧视舞台（art/fight2/*.png），所以这里是一块画布，
   不是 DOM 头像 —— 出招/挨打/格挡都是真的姿势切换 + 位移，不是换个字。
   pointer-events:none：它占着左半边，绝不能挡住卡组的点击。 */
#arena{position:absolute;left:26px;top:132px;width:1080px;height:430px;
       border-radius:18px;pointer-events:none;
       background:linear-gradient(180deg,rgba(32,22,58,.8),rgba(12,8,24,.92));
       border:1px solid rgba(255,255,255,.08);
       box-shadow:inset 0 0 70px rgba(80,50,160,.28), 0 12px 34px rgba(0,0,0,.5)}
#arenaTag{position:absolute;left:44px;top:142px;font-size:12px;color:#8a80a8;letter-spacing:2px;
       pointer-events:none}
/* 对手出的牌：摆在战场正中的空位（双方站位刻意让开中间，见 Stage.PX）*/
#foeCard{position:absolute;left:50%;top:296px;transform:translateX(-50%);z-index:12}
#foeCard .card{position:relative;--cw:118px;--ch:172px}
#foeLabel{position:absolute;left:50%;top:270px;transform:translateX(-50%);z-index:12;
  font-size:13px;color:#ffb0c0;letter-spacing:2px;opacity:0;transition:opacity .3s}
#foeLabel.on{opacity:1}

/* ── 玩家手牌卡槽 ───────────────────────────────────────────────── */
#slots{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
       display:flex;gap:26px;align-items:flex-end;height:230px}
.slot{
  width:140px;height:206px;border-radius:12px;flex:0 0 auto;
  border:2px dashed rgba(255,255,255,.16);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;
  font-size:12px;color:#7d739c;position:relative;
  transition:border-color .3s, background .3s, box-shadow .3s;
}
.slot.hot{border-color:rgba(255,215,110,.55);background:rgba(255,215,110,.06)}
.slot .card{--cw:132px;--ch:194px;bottom:8px}
/* 手牌可选时抬起 + 悬停上浮；已选中一张后其余变暗 */
.slot .card.pickable{cursor:pointer}
.slot .card.pickable:hover{transform:translateY(-18px) scale(1.05);filter:brightness(1.12)}
.slot .card.chosen{transform:translateY(-26px) scale(1.08);filter:brightness(1.18)}
.slot .card.chosen .front{box-shadow:inset 0 0 0 3px #ffd76e, 0 0 34px rgba(255,215,110,.75), 0 10px 24px rgba(0,0,0,.6)}
.slot .card.dimmed{filter:grayscale(.7) brightness(.5);opacity:.55;transform:scale(.94)}

/* ── 对手出的牌 ─────────────────────────────────────────────────── */

/* ── 过程文字（"双方同时出手…"）───────────────────────────────── */
#callout{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(.8);
  font-size:40px;font-weight:900;letter-spacing:6px;color:#fff;opacity:0;
  text-shadow:0 0 26px rgba(255,180,80,.8),0 4px 16px rgba(0,0,0,.8);
  pointer-events:none;white-space:nowrap;
}
#callout.show{animation:callout .95s cubic-bezier(.2,1.3,.3,1) both}
@keyframes callout{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}
}

/* ── 飘字：伤害/治疗/护盾 ───────────────────────────────────────── */
.float{
  position:absolute;font-size:34px;font-weight:900;pointer-events:none;
  font-variant-numeric:tabular-nums;letter-spacing:1px;
  text-shadow:0 3px 12px rgba(0,0,0,.85), 0 0 18px currentColor;
  animation:floatUp 1.15s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.5)}
  18%{opacity:1;transform:translate(-50%,-16px) scale(1.22)}
  36%{transform:translate(-50%,-26px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-108px) scale(.95)}
}
/* 命中闪光：整屏一层暖光 */
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,220,150,.5),transparent 62%)}
#flash.hit{animation:flashHit .34s ease-out both}
@keyframes flashHit{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
/* 受击抖动 */
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(6px)}
  50%{transform:translateX(-8px)}100%{transform:none}
}

/* ── 结果面板 ───────────────────────────────────────────────────── */
#result{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(6,4,12,.78);backdrop-filter:blur(6px);opacity:0;pointer-events:none;
  transition:opacity .45s ease;z-index:40;
}
#result.on{opacity:1;pointer-events:auto}
#result .panel{
  width:520px;padding:34px 30px;border-radius:20px;text-align:center;
  background:linear-gradient(165deg,rgba(46,32,74,.97),rgba(20,14,34,.97));
  border:2px solid rgba(255,215,110,.45);
  box-shadow:0 30px 80px rgba(0,0,0,.7), inset 0 0 40px rgba(120,80,220,.18);
  transform:scale(.86) translateY(20px);transition:transform .45s cubic-bezier(.2,1.3,.4,1);
}
#result.on .panel{transform:none}
#result .ttl{font-size:44px;font-weight:900;letter-spacing:4px;margin-bottom:6px;
  background:linear-gradient(180deg,#fff6c9,#ffb03a);-webkit-background-clip:text;background-clip:text;color:transparent}
#result.lose .ttl{background:linear-gradient(180deg,#ffd7dd,#ff5c7a);-webkit-background-clip:text;background-clip:text}
#result.draw .ttl{background:linear-gradient(180deg,#e6e2f2,#a99fc4);-webkit-background-clip:text;background-clip:text}
#result .sub{font-size:14px;color:#b8afd0;margin-bottom:18px;letter-spacing:1px}
#result .stats{display:flex;justify-content:center;gap:26px;margin-bottom:22px}
#result .stat{min-width:120px}
#result .stat .k{font-size:12px;color:#8a80a8;letter-spacing:1px;margin-bottom:4px}
#result .stat .v{font-size:30px;font-weight:900;color:#fff}
#result .stat .v.em{color:#5dffa0}
#result .log{max-height:120px;overflow:auto;text-align:left;font-size:12.5px;color:#a99fc4;
  background:rgba(0,0,0,.3);border-radius:10px;padding:10px 12px;margin-bottom:20px;line-height:1.7}
.btn{
  font:inherit;font-size:17px;font-weight:800;letter-spacing:2px;color:#1a1024;
  background:linear-gradient(180deg,#ffe9a8,#ffc23a);border:none;border-radius:99px;
  padding:13px 46px;cursor:pointer;
  box-shadow:0 8px 22px rgba(255,180,60,.35), inset 0 -3px 0 rgba(0,0,0,.16);
  transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(255,180,60,.5);filter:brightness(1.06)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:transparent;color:#cfc6e6;border:2px solid rgba(255,255,255,.22);box-shadow:none}
.btn.ghost:hover{border-color:rgba(255,215,110,.6);color:#ffd76e}
#startBtn{margin-top:8px}
.hint{font-size:12.5px;color:#8a80a8;letter-spacing:1px}
#err{
  position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  font-size:12px;color:#ff8fa3;background:rgba(0,0,0,.7);padding:4px 12px;border-radius:8px;display:none;z-index:60;
}
</style>
</head>
<body>
<div id="stage">
  <div id="flash"></div>

  <!-- 开场 -->
  <div id="opening">
    <div class="duel">
      <div class="fighter-big from-left" style="--c:#4dd8ff;--glow:rgba(77,216,255,.55)">
        <div class="avatar">🧙</div>
        <div class="nm-big">你</div>
        <div class="hp-big">生命 60 · 护盾 0</div>
      </div>
      <div id="vsRing"></div>
      <div id="vs">VS</div>
      <div class="fighter-big right from-right" style="--c:#ff4d6d;--glow:rgba(255,77,109,.55)">
        <div class="avatar">👹</div>
        <div class="nm-big">赤鬼</div>
        <div class="hp-big">生命 60 · 护盾 0</div>
      </div>
    </div>
    <div id="startBtn" style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <button class="btn" id="goBtn">开 始 对 决</button>
      <div class="hint">12 张卡 · 每轮抽 3 张选 1 张 · 共 5 轮 · 双方同时结算</div>
    </div>
  </div>

  <!-- 战斗界面 -->
  <div id="battle">
    <div class="hud left" style="--c:#4dd8ff">
      <div class="row">
        <div class="av">🧙</div>
        <div class="meta">
          <div class="who">你</div>
          <div class="bar"><i class="hp" id="pBar"></i></div>
          <div class="shbar"><i id="pShield"></i></div>
        </div>
      </div>
      <div class="num">生命 <b id="pHpTxt">60</b> / 60 · 护盾 <b id="pShTxt">0</b></div>
    </div>
    <div class="hud right" style="--c:#ff4d6d">
      <div class="row">
        <div class="av">👹</div>
        <div class="meta">
          <div class="who">赤鬼</div>
          <div class="bar"><i class="hp" id="eBar"></i></div>
          <div class="shbar"><i id="eShield"></i></div>
        </div>
      </div>
      <div class="num">生命 <b id="eHpTxt">60</b> / 60 · 护盾 <b id="eShTxt">0</b></div>
    </div>
    <div class="badges left" id="pBadges"></div>
    <div class="badges right" id="eBadges"></div>

    <div id="roundTag" style="position:absolute;top:18px;left:50%">
      <div class="r" id="roundTxt">第 1 轮</div>
      <div class="s">共 5 轮</div>
    </div>

    <canvas id="arena" width="1080" height="430"></canvas>
    <div id="arenaTag">战 场</div>
    <div id="deck"></div>
    <div id="deckPile">牌堆 12 张</div>

    <div id="foeLabel">赤鬼出牌</div>
    <div id="foeCard"></div>

    <div id="slots">
      <div class="slot" data-i="0">卡槽 1</div>
      <div class="slot" data-i="1">卡槽 2</div>
      <div class="slot" data-i="2">卡槽 3</div>
    </div>

    <div id="callout"></div>
  </div>

  <!-- 结果 -->
  <div id="result">
    <div class="panel">
      <div class="ttl" id="rTtl">胜 利</div>
      <div class="sub" id="rSub"></div>
      <div class="stats">
        <div class="stat"><div class="k">你的生命</div><div class="v em" id="rHp">—</div></div>
        <div class="stat"><div class="k">对手生命</div><div class="v" id="rEhp">—</div></div>
        <div class="stat"><div class="k">打了</div><div class="v" id="rRounds">—</div></div>
      </div>
      <div class="log" id="rLog"></div>
      <button class="btn" id="againBtn">再 来 一 局</button>
    </div>
  </div>

  <div id="err"></div>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   1. 卡池：12 张
   每张卡的字段：
     key 唯一键 · ico emoji 图标 · nm 名称 · ds 描述 · vl 数值标签
     type 决定卡面颜色与左上标签 · fx 结算函数（见 resolve 的顺序说明）
   数值是按"60 血 / 5 轮"配的：一轮大约掉 10–16 血，所以纯攻 5 轮打不死，
   必须有人把牌花在护盾和治疗上 —— 这就是每轮"选 1 张"的取舍来源。
   ══════════════════════════════════════════════════════════════════ */
const TYPE = {
  atk:  { n:"出击", c:"#ff4d6d" },
  def:  { n:"格挡", c:"#4dd8ff" },
  heal: { n:"回血", c:"#5dffa0" },
  sp:   { n:"特殊", c:"#b07dff" },
};
const CARDS = [
  { key:"strike",  type:"atk",  ico:"🗡️", nm:"突刺",   vl:"10 伤害",
    ds:"造成 10 点伤害", dmg:10 },
  { key:"heavy",   type:"atk",  ico:"🔨", nm:"重击",   vl:"16 伤害",
    ds:"造成 16 点伤害", dmg:16 },
  { key:"pierce",  type:"atk",  ico:"🏹", nm:"破防",   vl:"8 穿盾",
    ds:"无视护盾造成 8 点伤害", dmg:8, pierce:true },
  { key:"drain",   type:"atk",  ico:"🩸", nm:"吸血",   vl:"11 吸半",
    ds:"造成 11 点伤害，并回复其中一半", dmg:11, lifesteal:true },
  { key:"charge",  type:"atk",  ico:"⚡", nm:"蓄力",   vl:"下轮 ×2",
    ds:"本轮不出手：下一轮你的伤害翻倍", dmg:0, charge:true },
  { key:"block",   type:"def",  ico:"🛡️", nm:"格挡",   vl:"+10 盾",
    ds:"获得 10 点护盾", shield:10 },
  { key:"wall",    type:"def",  ico:"🧱", nm:"铁壁",   vl:"+18 盾",
    ds:"获得 18 点护盾", shield:18 },
  { key:"counter", type:"def",  ico:"🪞", nm:"反击",   vl:"+8 反弹",
    ds:"获得 8 点护盾，并反弹本轮所受伤害的一半", shield:8, counter:true },
  { key:"heal",    type:"heal", ico:"💚", nm:"治疗",   vl:"+12 血",
    ds:"回复 12 点生命", heal:12 },
  { key:"regen",   type:"heal", ico:"🌿", nm:"再生",   vl:"+6 血 +6 盾",
    ds:"回复 6 点生命，并获得 6 点护盾", heal:6, shield:6 },
  { key:"curse",   type:"sp",   ico:"🕸️", nm:"诅咒",   vl:"7 伤 减疗",
    ds:"造成 7 点伤害，对手本轮治疗减半", dmg:7, curse:true },
  /* ⚠ 反击波必须自带一点护盾，否则它是**死牌**：
     结算顺序是"① 加护盾 → ② 伤害 → … → ④ 特殊"，如果它自己不加盾，
     ④ 读到的"当前护盾"只可能是上一轮剩下的 —— 开局无盾时永远算出 0 伤害
     （这正是无头检查抓出来的：`反击波按当前护盾 12 造成伤害 [实际 2]`，2 是上轮残盾）。
     自带 6 盾之后它是"小额打脸 + 攒盾"，与「铁壁」连用才是真正的爆发（24 伤害）。 */
  { key:"reprisal",type:"sp",   ico:"💥", nm:"反击波", vl:"+6盾 · 盾=伤害",
    ds:"获得 6 点护盾，并造成等同于你护盾的伤害", shield:6, reprisal:true },
];
const CARD_BY_KEY = {};
CARDS.forEach((c) => { CARD_BY_KEY[c.key] = c; });

/* ══════════════════════════════════════════════════════════════════
   1.5 人物舞台（Stage）
   延用打斗 2.0 的立绘与资源（art/fight2/*.png，每个角色四姿势）：
     idle 待机 / strike 出招 / hit 受击 / ko 倒地
   为什么不做"骨骼动画"：那套资源里就四张图，硬拼骨骼反而更假。
   真实做法是**姿势切换 + 位移 + 缩放**：
     出招 = 前冲（位移）+ strike 图；挨打 = 后退 + hit 图 + 火花 + 震屏；
     格挡 = 轻退 + 一圈护盾光环；治疗 = 绿光上浮；蓄力 = 金色粒子。
   时间轴用**排程队列**而不是纯状态机：一帧要同时跑位移、姿势回正、特效，
   排程（arrivals）比"到点改状态"更好读也更好调。

   ⚠ 立绘是外部 PNG（不是 data URI）—— 用 file:// 双击打开时浏览器允许读同目录文件，
     所以这条路可行；但**如果立绘加载失败，页面不会崩**：drawFighter 会退回画剪影，
     并在控制台留一条警告（见 loadSprites 的 onerror）。
   ══════════════════════════════════════════════════════════════════ */
const SPRITE_DIR = "art/fight2/";
/* standH = 站姿高度（原图像素）；lowY = 该图底部留白（切图时对齐地面留下的）。
   这两个数来自 tools/dev/cut-fight2-sprites.ps1 生成的 <slug>.json —— 换图必须同步，
   不同步的后果是人物在场上忽大忽小或陷进地里。 */
const SPRITE_META = {
  player:  { slug:"puncher", standH:1036, lowY:{ idle:8,  strike:24, hit:17, ko:11 } },
  enemy:   { slug:"brawler", standH:423,  lowY:{ idle:26, strike:29, hit:22, ko:8  } },
};
const POSES = ["idle", "strike", "hit", "ko"];

const Stage = {
  cv: null, g: null, img: {}, ready: false, missing: [],
  /* 双方的绘制状态：pose 当前姿势、fwd 前冲(正=向对手)、vx 瞬时位移、
     lift 纵向抬升、glow 光环、alpha 不透明度、scale 缩放 */
  F: {
    player: { pose:"idle", fwd:0, vx:0, lift:0, glow:null, alpha:1, scale:1 },
    enemy:  { pose:"idle", fwd:0, vx:0, lift:0, glow:null, alpha:1, scale:1 },
  },
  arrivals: [],        // 排程：[{t:秒, fn}]，t<=0 当帧执行
  fx: [],              // 粒子：[{x,y,vx,vy,life,max,color,r}]
  shake: 0,
  t: 0, last: 0, raf: 0,
  /* 战场几何：设计尺寸 1080×430，地面线在 y=340。
     双方站位**刻意让开中间** —— 中间那块空位留给"对手出的牌"（#foeCard），
     否则牌会叠在人物脸上（实测第一版就是这样）。 */
  W: 1080, H: 430, GROUND: 340,
  PX: { player: 300, enemy: 780 },
  UNIT: 292,           // 站姿高度对应的绘制像素（决定人物大小）

  init() {
    /* ⚠ 守卫：begin() 可以被多次调用（再来一局），不挡的话每次都会再挂一个 rAF 循环，
       几个循环同时 tick 会让动画速度翻倍、特效数量爆炸。 */
    if (this._started) return;
    this._started = true;
    this.cv = $("arena");
    if (!this.cv || !this.cv.getContext) return;
    this.g = this.cv.getContext("2d");
    this.loadSprites();
    this.last = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.05, (now - this.last) / 1000);   // 夹住 dt：切标签页回来时别一次跳一大步
      this.last = now;
      this.tick(dt);
      this.draw();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },
  loadSprites() {
    Object.keys(SPRITE_META).forEach((who) => {
      const meta = SPRITE_META[who];
      POSES.forEach((p) => {
        const im = new Image();
        im.onerror = () => {
          this.missing.push(meta.slug + "_" + p + ".png");
          if (!this._warned) {
            this._warned = true;
            console.warn("[Stage] 立绘加载失败，改用剪影绘制。缺失：" + this.missing.join(", ") +
              "（立绘在 art/fight2/ 下；用 file:// 打开时需保证同目录可读）");
          }
        };
        im.src = SPRITE_DIR + meta.slug + "_" + p + ".png";
        this.img[meta.slug + "_" + p] = im;
      });
    });
    this.ready = true;
  },
  sprite(who, pose) {
    const meta = SPRITE_META[who];
    const im = this.img[meta.slug + "_" + pose];
    return im && im.complete && im.naturalWidth ? im : null;
  },

  /* ── 排程与特效 ───────────────────────────────────────────────── */
  after(sec, fn) { this.arrivals.push({ t: sec, fn: fn }); },
  burst(x, y, n, color, spread) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * (spread || 150);
      this.fx.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
        life: 0, max: 0.42 + Math.random() * 0.34, color: color, r: 1.6 + Math.random() * 2.6 });
    }
  },
  spark(x, y, color) {                       // 命中：向一侧喷的短线
    for (let i = 0; i < 14; i++) {
      const a = (-0.6 + Math.random() * 1.2) + (x < this.W / 2 ? 0 : Math.PI);
      const sp = 130 + Math.random() * 220;
      this.fx.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, max: 0.26 + Math.random() * 0.2, color: color, r: 2 + Math.random() * 3 });
    }
  },

  /* ── 动作接口（结算流程调用）────────────────────────────────────── */
  /** 出招：前冲 + strike 姿势，随后自动回正。
      持续时间要和结算流程的等待对齐：伤害飘字出现在 attack 之后约 0.8 秒
      （见 resolveRound 里的 sleep），姿势若在 0.5 秒就收回，飘字出来时人已经站好了 ——
      "拳头收回来了才掉血"，看着很假。所以保持到 0.78 秒。 */
  attack(who) {
    const f = this.F[who];
    f.pose = "strike";
    const dir = who === "player" ? 1 : -1;
    this.after(0.02, () => { f.vx = 24 * dir; });
    this.after(0.40, () => { f.vx = 0; });
    this.after(0.78, () => { if (f.pose === "strike") f.pose = "idle"; });
    return 0.5;
  },
  /** 挨打：后仰 + hit 姿势 + 火花 + 震屏。同样保持到飘字之后。 */
  hurt(who, big) {
    const f = this.F[who];
    f.pose = "hit";
    const dir = who === "player" ? -1 : 1;
    this.after(0.02, () => { f.vx = (big ? 20 : 12) * dir; });
    this.after(0.30, () => { f.vx = 0; });
    this.after(0.74, () => { if (f.pose === "hit") f.pose = "idle"; });
    this.shake = big ? 9 : 5;
    this.spark(this.PX[who] + (who === "player" ? 40 : -40), this.GROUND - 118, "#ffd0a0");
    return 0.5;
  },
  /** 格挡成功：一圈护盾光环扩散 */
  guard(who) {
    this.F[who].glow = { t: 0, dur: 0.6, color: "143,216,255" };
    this.burst(this.PX[who], this.GROUND - 100, 16, "#8fd8ff", 90);
    return 0.45;
  },
  /** 治疗：绿色光点上浮 */
  heal(who) {
    const x = this.PX[who], y = this.GROUND - 60;
    for (let i = 0; i < 18; i++) {
      this.fx.push({ x: x + (Math.random() - 0.5) * 70, y: y, vx: (Math.random() - 0.5) * 26,
        vy: -60 - Math.random() * 70, life: 0, max: 0.7 + Math.random() * 0.4,
        color: "#7dffb0", r: 2 + Math.random() * 2.4 });
    }
    return 0.5;
  },
  /** 加护盾：蓝色光点 + 光环 */
  shield(who) {
    this.F[who].glow = { t: 0, dur: 0.55, color: "143,216,255" };
    this.burst(this.PX[who], this.GROUND - 96, 14, "#8fd8ff", 80);
    return 0.45;
  },
  /** 蓄力：金色粒子向身上汇聚（反向速度） */
  charge(who) {
    const x = this.PX[who], y = this.GROUND - 80;
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 70;
      this.fx.push({ x: x + Math.cos(a) * d, y: y + Math.sin(a) * d,
        vx: -Math.cos(a) * d * 1.6, vy: -Math.sin(a) * d * 1.6,
        life: 0, max: 0.5, color: "#ffd76e", r: 2 + Math.random() * 2 });
    }
    return 0.5;
  },
  /** 倒地：ko 姿势躺下（整局结束时） */
  ko(who) {
    this.F[who].pose = "ko";
    this.shake = 12;
    this.burst(this.PX[who], this.GROUND - 40, 22, "#ffb0b0", 170);
  },
  /** 回合结束：双方回正 */
  reset() {
    POSES.length && Object.keys(this.F).forEach((k) => {
      const f = this.F[k];
      if (f.pose === "ko") return;
      f.pose = "idle"; f.vx = 0; f.fwd = 0;
    });
  },

  /* ── 每帧 ─────────────────────────────────────────────────────── */
  tick(dt) {
    this.t += dt;
    /* 排程：只执行到点的，剩下的留到下一帧 */
    if (this.arrivals.length) {
      const keep = [];
      for (const a of this.arrivals) { a.t -= dt; if (a.t <= 0) a.fn(); else keep.push(a); }
      this.arrivals = keep;
    }
    /* 特效：重力 + 生命衰减 */
    if (this.fx.length) {
      const keep = [];
      for (const p of this.fx) {
        p.life += dt;
        if (p.life >= p.max) continue;
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.vx *= 0.98;
        keep.push(p);
      }
      this.fx = keep;
    }
    /* 位移回弹 + 姿态平滑 */
    Object.keys(this.F).forEach((k) => {
      const f = this.F[k];
      f.fwd += (f.vx - f.fwd) * Math.min(1, dt * 12);
      if (f.glow) { f.glow.t += dt; if (f.glow.t >= f.glow.dur) f.glow = null; }
      /* 待机呼吸：只有 idle 才上下浮动，出招/挨打时稳住，不然看着发飘 */
      f.lift = (f.pose === "idle") ? Math.sin(this.t * 2.1 + (k === "player" ? 0 : 1.4)) * 3 : 0;
    });
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 46);
  },

  /* ── 绘制 ─────────────────────────────────────────────────────── */
  draw() {
    const g = this.g;
    if (!g) return;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, this.W, this.H);
    /* 震屏：整体偏移（不是移动画布元素，避免和布局打架） */
    if (this.shake > 0) {
      g.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    }
    this.drawFloor(g);
    /* 后画的一方在上层：谁出招谁画在前面，看着更"打过去" */
    const order = this.F.player.pose === "strike" ? ["enemy", "player"] : ["player", "enemy"];
    order.forEach((who) => this.drawFighter(g, who));
    this.drawFx(g);
  },
  drawFloor(g) {
    const W = this.W, gy = this.GROUND;
    /* 地面：一条亮线 + 两侧渐隐，营造"擂台"感 */
    const grd = g.createLinearGradient(0, gy - 30, 0, this.H);
    grd.addColorStop(0, "rgba(120,90,220,.22)");
    grd.addColorStop(1, "rgba(10,6,20,0)");
    g.fillStyle = grd;
    g.fillRect(0, gy, W, this.H - gy);
    g.strokeStyle = "rgba(180,150,255,.35)";
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, gy); g.lineTo(W, gy); g.stroke();
    /* 场地中线（对峙的暗示） */
    g.strokeStyle = "rgba(255,255,255,.06)";
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(W / 2, gy - 170); g.lineTo(W / 2, gy); g.stroke();
    /* 人物脚下投影 */
    ["player", "enemy"].forEach((who) => {
      const x = this.PX[who] + this.F[who].fwd;
      g.save();
      g.globalAlpha = 0.34;
      g.fillStyle = "#000";
      g.beginPath();
      if (g.ellipse) g.ellipse(x, gy + 4, 62, 13, 0, 0, Math.PI * 2);
      else g.arc(x, gy + 4, 40, 0, Math.PI * 2);
      g.fill();
      g.restore();
    });
  },
  drawFighter(g, who) {
    const f = this.F[who];
    const meta = SPRITE_META[who];
    const x = this.PX[who] + f.fwd;
    const gy = this.GROUND;
    const im = this.sprite(who, f.pose);
    const unit = this.UNIT;
    const flip = who === "enemy";              // 对手面向左：水平镜像

    g.save();
    /* 光环（格挡/加盾）：在人物下层画一圈扩散的环 */
    if (f.glow) {
      const k = f.glow.t / f.glow.dur;
      g.save();
      g.globalAlpha = (1 - k) * 0.85;
      g.strokeStyle = "rgba(" + f.glow.color + ",1)";
      g.lineWidth = 4 * (1 - k) + 1;
      g.beginPath();
      if (g.ellipse) g.ellipse(x, gy - unit * 0.42, unit * (0.22 + k * 0.26), unit * (0.34 + k * 0.4), 0, 0, Math.PI * 2);
      else g.arc(x, gy - unit * 0.42, unit * (0.3 + k * 0.3), 0, Math.PI * 2);
      g.stroke();
      g.restore();
    }
    if (im) {
      const scale = unit / meta.standH;                 // 每单位像素：先定站姿高度，再按各姿势自身尺寸画
      const w = im.naturalWidth * scale, h = im.naturalHeight * scale;
      const lowY = (meta.lowY[f.pose] || 0) * scale;    // 该图的底部留白（否则会陷进地里）
      g.save();
      g.globalAlpha = f.alpha;
      g.translate(x, gy - f.lift);
      if (flip) g.scale(-1, 1);
      g.drawImage(im, -w / 2, -(h - lowY), w, h);
      g.restore();
    } else {
      /* 剪影回落：立绘没加载出来也要看得出"有两个人在打" */
      g.save();
      g.globalAlpha = f.alpha * 0.75;
      g.fillStyle = who === "player" ? "rgba(77,216,255,.55)" : "rgba(255,77,109,.55)";
      g.beginPath();
      if (g.ellipse) g.ellipse(x, gy - unit * 0.45, unit * 0.16, unit * 0.45, 0, 0, Math.PI * 2);
      else g.arc(x, gy - unit * 0.45, unit * 0.3, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }
    g.restore();
  },
  drawFx(g) {
    g.save();
    this.fx.forEach((p) => {
      const k = 1 - p.life / p.max;
      g.globalAlpha = Math.max(0, k);
      g.fillStyle = p.color;
      const r = p.r * (0.5 + k * 0.9);
      g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.fill();
    });
    g.restore();
  },
};

/* ══════════════════════════════════════════════════════════════════
   2. 规则常量
   ══════════════════════════════════════════════════════════════════ */
const MAXHP = 60, ROUNDS = 5, HAND = 3, DECK = 12;

/* ══════════════════════════════════════════════════════════════════
   3. 状态
   ══════════════════════════════════════════════════════════════════ */
let S = null;                        // 每局重置
function newState() {
  return {
    round: 1, over: false,
    p: { hp: MAXHP, shield: 0, charge: false, curse: false, dealt: 0 },
    e: { hp: MAXHP, shield: 0, charge: false, curse: false, dealt: 0 },
    deck: [],                        // 抽牌堆（洗过牌）
    hand: [],                        // 本轮已抽到的牌（最多 HAND 张）
    /* phase 是这一轮的阶段机：draw（你点牌堆抽）→ pick（选一张打）→ resolve → 下一轮。
       ⚠ 必须显式存它，不能用"手牌数量"推断：手牌张数在飞行动画期间是不确定的，
         靠数量判断会在动画中途把玩家放进"选牌"阶段（点空白处没反应）。 */
    phase: "draw",
    drawn: 0,                        // 本轮已抽几张（上限 HAND）
    picked: -1,                      // 玩家选中的槽位
    eCard: null,                     // 对手本轮出的牌
    log: [],
  };
}

/* ── DOM 小工具 ─────────────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
const rnd = (n) => Math.floor(Math.random() * n);
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ── 卡牌 DOM ───────────────────────────────────────────────────── */
/** 造一张卡（正反面都在 DOM 里，靠 .flipped 翻转）。
 *  @param faceDown 初始是否背面朝上（默认 true） */
function makeCard(card, faceDown) {
  const el = document.createElement("div");
  el.className = "card" + (faceDown === false ? " flipped" : "");
  el.style.setProperty("--c", TYPE[card.type].c);
  const t = TYPE[card.type];
  el.innerHTML =
    '<div class="inner">' +
      '<div class="face back"></div>' +
      '<div class="face front">' +
        '<span class="tag">' + t.n + "</span>" +
        '<span class="ico">' + card.ico + "</span>" +
        '<span class="nm">' + card.nm + "</span>" +
        '<span class="vl">' + card.vl + "</span>" +
        '<span class="ds">' + card.ds + "</span>" +
      "</div>" +
    "</div>";
  return el;
}
function flip(el, faceUp) { el.classList.toggle("flipped", faceUp); }

/* ══════════════════════════════════════════════════════════════════
   4. 窗口适配：设计画布 1280×860 等比缩放到窗口
   用 scale 而不是媒体查询，是为了让所有用 px 写的动画位移在任何窗口下都一致。
   ══════════════════════════════════════════════════════════════════ */
const DW = 1280, DH = 860;
function fitStage() {
  const k = Math.min(window.innerWidth / DW, window.innerHeight / DH);
  $("stage").style.transform = "scale(" + k + ")";
}
window.addEventListener("resize", fitStage);
fitStage();

/** 把设计坐标换算成屏幕坐标（FLIP 动画要用真实屏幕位置来算位移） */
function rectIn(el) {
  const r = el.getBoundingClientRect();
  const s = $("stage").getBoundingClientRect();
  const k = s.width / DW;                       // 当前缩放比
  return { x: (r.left - s.left) / k, y: (r.top - s.top) / k, w: r.width / k, h: r.height / k };
}

/* ══════════════════════════════════════════════════════════════════
   5. 视觉反馈：飘字 / 闪光 / 抖动
   ══════════════════════════════════════════════════════════════════ */
function floatText(x, y, text, color, size) {
  const d = document.createElement("div");
  d.className = "float";
  d.textContent = text;
  d.style.cssText = "left:" + x + "px;top:" + y + "px;color:" + color +
    (size ? ";font-size:" + size + "px" : "");
  $("stage").appendChild(d);
  setTimeout(() => d.remove(), 1200);
}
function flash() {
  const f = $("flash");
  f.classList.remove("hit");
  void f.offsetWidth;                            // 强制重排，让动画能重放
  f.classList.add("hit");
}
function shake(el) {
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
}
/** 对手/玩家的飘字锚点（设计坐标） */
const ANCHOR = { p: { x: 250, y: 250 }, e: { x: 1030, y: 250 } };
function pop(who, text, color, dx, size) {
  const a = ANCHOR[who];
  floatText(a.x + (dx || 0), a.y, text, color, size);
}

/* ══════════════════════════════════════════════════════════════════
   6. HUD 刷新（血条用 transform:scaleX 过渡 → 平滑）
   ══════════════════════════════════════════════════════════════════ */
function paintHud() {
  const set = (barId, txtId, shId, shTxtId, o) => {
    const pct = Math.max(0, Math.min(1, o.hp / MAXHP));
    const b = $(barId);
    b.style.transform = "scaleX(" + pct + ")";
    b.classList.toggle("low", pct <= 0.34);
    $(txtId).textContent = Math.max(0, o.hp);
    const sp = Math.max(0, Math.min(1, o.shield / 30));   // 护盾条以 30 为满格参照
    $(shId).style.transform = "scaleX(" + sp + ")";
    $(shTxtId).textContent = o.shield;
  };
  set("pBar", "pHpTxt", "pShield", "pShTxt", S.p);
  set("eBar", "eHpTxt", "eShield", "eShTxt", S.e);
  /* 状态标记：蓄力 / 被诅咒 */
  const badge = (o) => (o.charge ? '<span class="badge">⚡ 蓄力中 · 下轮伤害 ×2</span>' : "") +
                       (o.curse ? '<span class="badge">🕸️ 被诅咒 · 本轮治疗减半</span>' : "");
  $("pBadges").innerHTML = badge(S.p);
  $("eBadges").innerHTML = badge(S.e);
  $("roundTxt").textContent = "第 " + S.round + " 轮";
  /* 牌堆标签要跟着阶段说清"现在该你做什么" —— 这里是玩家唯一会盯着看的地方 */
  const left = HAND - (S.drawn || 0);
  $("deckPile").textContent = (S.phase === "draw")
    ? "点牌堆抽 " + left + " 张\n（牌堆 " + S.deck.length + " 张）"
    : "牌堆 " + S.deck.length + " 张";
  $("deckPile").style.whiteSpace = "pre-line";
  /* 抽牌阶段给空卡槽加提示描边，抽满就撤掉 */
  document.querySelectorAll("#slots .slot").forEach((el, i) => {
    el.classList.toggle("waiting", S.phase === "draw" && i >= (S.drawn || 0));
  });
}

/* ══════════════════════════════════════════════════════════════════
   7. 中央牌堆：12 张卡背（玩家自己点着抽）
   现在不需要"模拟牌堆"了：中央显示的张数**就是** S.deck.length，
   玩家点掉一张，S.deck 少一张、DOM 也少一张 —— 两边天然一致。
   （旧版是自动抽牌，得靠 syncDeckVisual 反推"应该剩几张"，
     那种"视觉投影"很容易和真牌堆走偏，已删除。）
   ══════════════════════════════════════════════════════════════════ */
function buildDeckVisual(n) {
  const box = $("deck");
  box.innerHTML = "";
  for (let i = 0; i < n; i++) box.appendChild(makeCard(CARDS[i % CARDS.length], true));
}

/* ══════════════════════════════════════════════════════════════════
   8. 抽牌动画（FLIP）
   为什么要 FLIP：卡要从"牌堆里的第 N 张"飞到"底部第 i 个卡槽"，
   两端坐标都由布局决定；直接在布局里做 transition 会牵扯整页重排。
   FLIP 只动 transform，既便宜又不会影响别的元素。
   ══════════════════════════════════════════════════════════════════ */
/** 造一个"卡背幽灵"，从 from 矩形飞到 to 元素的位置（FLIP）。
 *  from 是飞入前记下的设计坐标（{x,y,w,h}），to 是目标元素（卡槽）。 */
async function flyFrom(from, toEl, delayMs) {
  if (delayMs) await sleep(delayMs);
  const to = rectIn(toEl);
  const ghost = document.createElement("div");
  ghost.className = "card";                      // 不 flipped → 显示卡背那面
  ghost.style.cssText = "--cw:" + from.w + "px;--ch:" + from.h + "px;--c:#8a80a8;" +
    "position:absolute;left:0;top:0;z-index:30;pointer-events:none";
  ghost.innerHTML = '<div class="inner"><div class="face back"></div><div class="face front"></div></div>';
  $("stage").appendChild(ghost);
  const dx = to.x + (to.w - from.w) / 2 - from.x;
  const dy = to.y + (to.h - from.h) / 2 - from.y;
  const sc = to.w / from.w;
  const anim = ghost.animate(
    [
      { transform: "translate(" + from.x + "px," + from.y + "px) rotate(-7deg) scale(1)", opacity: 1 },
      { transform: "translate(" + (from.x + dx * 0.55) + "px," + (from.y + dy * 0.3 - 52) + "px) rotate(7deg) scale(" + (sc * 1.12) + ")",
        opacity: 1, offset: 0.6 },
      { transform: "translate(" + (from.x + dx) + "px," + (from.y + dy) + "px) rotate(0deg) scale(" + sc + ")", opacity: 1 },
    ],
    { duration: 500, easing: "cubic-bezier(.25,.9,.3,1)", fill: "forwards" }
  );
  if (window.__dbg) window.__dbg.flies++;
  await anim.finished.catch(() => {});
  ghost.remove();
}

/* ══════════════════════════════════════════════════════════════════
   9. 一轮的流程
   ══════════════════════════════════════════════════════════════════ */
/** 抽 n 张进手牌。**只动逻辑，不做动画** —— 飞牌动画归 pickDrawFromDeck 管。 */
function drawCards(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    if (!S.deck.length) S.deck = shuffle(CARDS.map((c) => c.key));   // 抽完洗牌循环
    out.push(S.deck.pop());
  }
  return out;
}
/** 确保牌堆至少剩 n 张；不够就把卡池洗回来（抽空循环使用）。
    ⚠ 必须在**发牌之前**调用：12 张牌抽 4 轮正好抽干，第 5 轮需要重洗。
     如果只在 drawCards 内部重洗，逻辑会补上牌、但**中央卡背还停在 0 张** ——
     玩家看到的是空牌堆、没有可点的卡，整局卡死在第 5 轮的抽牌阶段
     （实测：循环 90 次都停在「第 5 轮 ph=draw pick=0」，只有真跑才会暴露）。 */
function ensureDrawable(n) {
  if (S.deck.length < n) {
    S.deck = shuffle(CARDS.map((c) => c.key));
    buildDeckVisual(S.deck.length);        // 视觉也跟着重建，玩家才有点得着的牌
    return true;
  }
  return false;
}

/** 玩家从中央 12 张卡背里**自己点选**要抽的那张。
    需求原话："需要我点击选择了那几张卡牌，卡牌才会翻转显示技能并使用" ——
    所以这里必须由玩家点，不能自动飞（第一版是自动抽，玩家反馈"这不是我自己选择抽的"）。
    流程：记下被点卡背的坐标 → 从牌堆逻辑抽一张 → 飞向第一个空卡槽 → 3D 翻面。 */
async function pickDrawFromDeck(backEl) {
  if (S.over || S.phase !== "draw") return;
  if (S.drawn >= HAND) return;
  const slot = S.drawn;
  S.drawn++;
  /* 立即把这张卡背标成"已选中"并停止接收点击，避免连点抽超 */
  backEl.classList.add("picked");
  const src = rectIn(backEl);
  const key = drawCards(1)[0];
  S.hand[slot] = key;
  backEl.remove();                                   // 视觉上从中间牌堆消失
  const slots = Array.from(document.querySelectorAll(".slot"));
  await flyFrom(src, slots[slot], 0);
  const cardEl = makeCard(CARD_BY_KEY[key], true);
  cardEl.dataset.slot = slot;
  slots[slot].appendChild(cardEl);
  await sleep(160);
  flip(cardEl, true);                                // 3D 翻面
  await sleep(140);
  paintHud();
  if (S.drawn >= HAND) {
    /* 三张都抽完了 → 交给"选一张出招"阶段 */
    S.phase = "pick";
    document.querySelectorAll("#deck .card").forEach((el) => el.classList.remove("pickable"));
    document.querySelectorAll("#slots .card").forEach((el) => {
      el.classList.add("pickable");
      el.addEventListener("click", () => pickCard(Number(el.dataset.slot)));
    });
    showCallout("选 一 张 出 手");
    /* 状态行同步（hintNow 走的是 paintHud → 这里补一句提示） */
    $("deckPile").textContent = "三张已抽好 —— 点下面的牌出招";
  } else {
    showCallout("再 抽 " + (HAND - S.drawn) + " 张");
  }
}

async function startRound() {
  if (S.over) return;
  S.picked = -1;
  S.eCard = null;
  S.hand = [];
  S.drawn = 0;
  S.phase = "draw";                                  // draw（你来抽）| pick（选一张打）
  $("foeCard").innerHTML = "";
  $("foeLabel").classList.remove("on");
  const slots = Array.from(document.querySelectorAll(".slot"));
  slots.forEach((s) => {
    const old = s.querySelector(".card");
    if (old) old.remove();
    s.classList.remove("hot");
  });
  /* 中央牌背 = 真牌堆剩余的张数（视觉与真值一致）。
     ⚠ 先 ensureDrawable：第 5 轮会把 12 张抽干，必须**在发牌前**重洗并重建卡背，
       否则玩家看到空牌堆、无牌可点（实测整局卡死在这一步）。 */
  ensureDrawable(1);
  buildDeckVisual(S.deck.length);
  document.querySelectorAll("#deck .card").forEach((el) => {
    el.classList.add("pickable");
    el.addEventListener("click", () => pickDrawFromDeck(el));
  });
  paintHud();
  showCallout("点 牌 堆 抽 三 张");
}

/** 玩家点选要打出的那张：选中高亮、其余变暗，然后自动进入结算 */
function pickCard(i) {
  if (S.picked >= 0 || S.over || S.phase !== "pick") return;
  S.picked = i;
  S.phase = "resolve";
  document.querySelectorAll("#slots .card").forEach((el) => {
    const idx = Number(el.dataset.slot);
    el.classList.toggle("chosen", idx === i);
    el.classList.toggle("dimmed", idx !== i);
    el.classList.remove("pickable");
    el.style.cursor = "default";
  });
  resolveRound();
}

function showCallout(text) {
  const c = $("callout");
  c.textContent = text;
  c.classList.remove("show");
  void c.offsetWidth;
  c.classList.add("show");
}

/* ── 对手选牌：按需求是**随机**出 1 张 ──────────────────────────── */
function foePick() {
  return CARDS[rnd(CARDS.length)];
}

/* ══════════════════════════════════════════════════════════════════
   10. 结算
   结算顺序（按需求）：① 加护盾 ② 伤害（护盾先抵） ③ 治疗 ④ 特殊效果
   "同时结算"的关键：先把双方的"意图"都算成数值，再一起落到双方身上 ——
   这样先手不会因为顺序占便宜。反击/吸血这类依赖"本轮所受伤害"的效果
   放在最后一步（④）用已经落地的伤害来算。
   ══════════════════════════════════════════════════════════════════ */
async function resolveRound() {
  const pCard = CARD_BY_KEY[S.hand[S.picked]];
  const eCard = foePick();
  S.eCard = eCard;

  /* 双方同时起身（出招姿势），这是"要动手了"的信号 */
  Stage.reset();
  if ((pCard.dmg || pCard.reprisal) && !pCard.charge) Stage.attack("player");
  if ((eCard.dmg || eCard.reprisal) && !eCard.charge) Stage.attack("enemy");

  /* 对手出牌：在对手区域展示并翻面 */
  $("foeLabel").classList.add("on");
  const fc = makeCard(eCard, true);
  fc.style.position = "relative";
  $("foeCard").innerHTML = "";
  $("foeCard").appendChild(fc);
  await sleep(320);
  flip(fc, true);
  await sleep(420);
  showCallout("同 时 出 手");
  await sleep(760);

  /* 蓄力：本轮伤害翻倍（在结算前读，然后清掉标记） */
  const pMul = S.p.charge ? 2 : 1;
  const eMul = S.e.charge ? 2 : 1;
  S.p.charge = false;
  S.e.charge = false;

  const dmgOf = (card, mul, curse) => {
    let d = card.dmg || 0;
    if (card.reprisal) d = 0;                       // 反击波的伤害在④按护盾算
    if (curse) d = Math.round(d * 0.75);            // 被诅咒：出手也变弱一点，和治疗减半配套
    return d * mul;
  };
  const pIntent = { dmg: dmgOf(pCard, pMul, S.p.curse), pierce: !!pCard.pierce };
  const eIntent = { dmg: dmgOf(eCard, eMul, S.e.curse), pierce: !!eCard.pierce };

  /* ① 护盾（含再生这类"回血+护盾"的盾）*/
  const pShieldGain = pCard.shield || 0;
  const eShieldGain = eCard.shield || 0;
  if (pShieldGain) { S.p.shield += pShieldGain; pop("p", "+" + pShieldGain + " 盾", "#8fd8ff", -70); Stage.shield("player"); }
  if (eShieldGain) { S.e.shield += eShieldGain; pop("e", "+" + eShieldGain + " 盾", "#8fd8ff", 70); Stage.shield("enemy"); }
  if (pShieldGain || eShieldGain) { paintHud(); await sleep(600); }

  /* ② 伤害：护盾先抵（破防牌无视护盾） */
  const applyDamage = (target, intent, who) => {
    let dmg = intent.dmg;
    if (dmg <= 0) return 0;
    let absorbed = 0;
    if (!intent.pierce && target.shield > 0) {
      absorbed = Math.min(target.shield, dmg);
      target.shield -= absorbed;
      dmg -= absorbed;
    }
    target.hp = Math.max(0, target.hp - dmg);
    return { dealt: dmg, absorbed: absorbed };
  };
  const pRes = applyDamage(S.e, pIntent, "e");     // 玩家打到对手
  const eRes = applyDamage(S.p, eIntent, "p");     // 对手打到玩家
  const pDealt = pRes ? pRes.dealt : 0;
  const eDealt = eRes ? eRes.dealt : 0;
  /* 舞台反应：打进去 → 挨打后仰 + 火花 + 震屏；被护盾全挡 → 格挡光环。
     这一层是"看得见的打斗"——数字飘字之外，人物必须真的动。 */
  if (pIntent.dmg > 0) {
    S.p.dealt += pDealt;
    if (pDealt > 0) { pop("e", "-" + pDealt, "#ff6b8a", 0, 44); Stage.hurt("enemy", pDealt >= 15); }
    else { pop("e", "护盾全挡", "#8fd8ff", 0, 26); Stage.guard("enemy"); }
  }
  if (eIntent.dmg > 0) {
    S.e.dealt += eDealt;
    if (eDealt > 0) { pop("p", "-" + eDealt, "#ff6b8a", 0, 44); Stage.hurt("player", eDealt >= 15); }
    else { pop("p", "护盾全挡", "#8fd8ff", 0, 26); Stage.guard("player"); }
  }
  if (pIntent.dmg > 0 || eIntent.dmg > 0) {
    flash();
    paintHud();
    await sleep(820);
  }

  /* ③ 治疗（被诅咒则减半） */
  const healOf = (card, who) => {
    if (!card.heal) return 0;
    let h = card.heal;
    if (who.curse) h = Math.floor(h / 2);
    return h;
  };
  const pH = healOf(pCard, S.p), eH = healOf(eCard, S.e);
  if (pH) { S.p.hp = Math.min(MAXHP, S.p.hp + pH); pop("p", "+" + pH, "#5dffa0", -70); Stage.heal("player"); }
  if (eH) { S.e.hp = Math.min(MAXHP, S.e.hp + eH); pop("e", "+" + eH, "#5dffa0", 70); Stage.heal("enemy"); }
  if (pH || eH) { paintHud(); await sleep(620); }

  /* ④ 特殊效果 */
  /* 吸血：回复造成伤害的一半。
     ⚠ 用 floor 不用 round：卡面写的是"回复其中一半"，11 的一半是 5.5 ——
       四舍五入会变成 6（比写着的多），向下取整才是玩家能自己算出来的 5。 */
  if (pCard.lifesteal && pDealt > 0) {
    const h = Math.floor(pDealt / 2);
    S.p.hp = Math.min(MAXHP, S.p.hp + h);
    pop("p", "吸血 +" + h, "#5dffa0", -110);
    paintHud(); await sleep(420);
  }
  if (eCard.lifesteal && eDealt > 0) {
    const h = Math.floor(eDealt / 2);
    S.e.hp = Math.min(MAXHP, S.e.hp + h);
    pop("e", "吸血 +" + h, "#5dffa0", 110);
    paintHud(); await sleep(420);
  }
  /* 反击：反弹本轮所受伤害的一半（打在对方身上，护盾可挡） */
  const reflect = (self, foe, card, taken, who) => {
    if (!card.counter || taken <= 0) return 0;
    let r = Math.round(taken / 2);
    let absorbed = 0;
    if (foe.shield > 0) { absorbed = Math.min(foe.shield, r); foe.shield -= absorbed; r -= absorbed; }
    foe.hp = Math.max(0, foe.hp - r);
    self.reflected = (self.reflected || 0) + r;
    return r;
  };
  const pRef = reflect(S.p, S.e, pCard, eDealt, "p");
  const eRef = reflect(S.e, S.p, eCard, pDealt, "e");
  if (pRef > 0) pop("e", "反弹 -" + pRef, "#b07dff", 0, 32);
  if (eRef > 0) pop("p", "反弹 -" + eRef, "#b07dff", 0, 32);
  if (pRef || eRef) { paintHud(); await sleep(520); }
  /* 反击波：伤害 = 自己当前护盾 */
  const reprisal = (self, foe, card, who) => {
    if (!card.reprisal) return 0;
    let d = self.shield;
    if (d <= 0) return 0;
    let absorbed = 0;
    if (foe.shield > 0) { absorbed = Math.min(foe.shield, d); foe.shield -= absorbed; d -= absorbed; }
    foe.hp = Math.max(0, foe.hp - d);
    self.dealt += d;
    return d;
  };
  const pRep = reprisal(S.p, S.e, pCard, "p");
  const eRep = reprisal(S.e, S.p, eCard, "e");
  if (pRep > 0) { pop("e", "-" + pRep, "#ff6b8a", 0, 40); flash(); }
  if (eRep > 0) { pop("p", "-" + eRep, "#ff6b8a", 0, 40); flash(); }
  if (pRep || eRep) { paintHud(); await sleep(560); }
  /* 蓄力 / 诅咒标记 */
  if (pCard.charge) { S.p.charge = true; Stage.charge("player"); }
  if (eCard.charge) { S.e.charge = true; Stage.charge("enemy"); }
  S.p.curse = !!eCard.curse;                      // 对手的诅咒作用在我身上
  S.e.curse = !!pCard.curse;
  paintHud();
  await sleep(520);
  Stage.reset();                                  // 双方回待机（下一轮再起手）

  /* 日志 */
  S.log.push("第 " + S.round + " 轮：你出「" + pCard.nm + "」 vs 赤鬼出「" + eCard.nm + "」" +
    " → 你 " + S.p.hp + " 血 / 赤鬼 " + S.e.hp + " 血");

  /* 结束判定 */
  if (S.p.hp <= 0 || S.e.hp <= 0) return endGame();
  if (S.round >= ROUNDS) return endGame();
  S.round++;
  await sleep(300);
  startRound();
}

/* ══════════════════════════════════════════════════════════════════
   11. 结束
   ══════════════════════════════════════════════════════════════════ */
function endGame() {
  S.over = true;
  const win = S.p.hp > S.e.hp, draw = S.p.hp === S.e.hp;
  /* 舞台收尾：输的一方倒地（谁归零谁倒；都没归零则血少的一方倒） */
  Stage.shake = 10;
  if (S.e.hp <= 0 || (!draw && !win)) Stage.ko("enemy");
  if (S.p.hp <= 0 || (!draw && win)) Stage.ko("player");
  const box = $("result");
  box.classList.remove("on", "win", "lose", "draw");
  box.classList.add(draw ? "draw" : win ? "win" : "lose");
  $("rTtl").textContent = draw ? "平 局" : win ? "胜 利" : "败 北";
  $("rSub").textContent = draw ? "双方同归于尽"
    : win ? (S.e.hp <= 0 ? "你把赤鬼打倒了" : "5 轮结束，你的生命更高")
          : (S.p.hp <= 0 ? "你被赤鬼打倒了" : "5 轮结束，赤鬼的生命更高");
  $("rHp").textContent = S.p.hp;
  $("rEhp").textContent = S.e.hp;
  $("rRounds").textContent = S.round + " 轮";
  $("rLog").innerHTML = S.log.map((l) => "<div>" + l + "</div>").join("");
  void box.offsetWidth;
  box.classList.add("on");
}

/* ══════════════════════════════════════════════════════════════════
   12. 启动
   ══════════════════════════════════════════════════════════════════ */
async function begin() {
  S = newState();
  window.S = S;                    // 同上：让无头脚本能读到阶段（每局重建后要重新挂）
  S.deck = shuffle(CARDS.map((c) => c.key));
  $("result").classList.remove("on");
  $("foeCard").innerHTML = "";
  $("foeLabel").classList.remove("on");
  document.querySelectorAll("#slots .slot").forEach((s) => {
    const c = s.querySelector(".card"); if (c) c.remove();
    s.classList.remove("hot");
  });
  /* 开场：淡出 → 战斗界面淡入 + 中央 12 张卡背 */
  $("opening").classList.add("hide");
  await sleep(480);
  Stage.init();                   // 启动战场（立绘 + rAF 循环）；重复调用会叠加循环，见下面的守卫
  buildDeckVisual(DECK);          // ⚠ 这里原来写的是 buildDeck()（改名前的旧名），
                                  //   结果点「开始对决」直接 ReferenceError、毫无反应 ——
                                  //   只有真在浏览器里点一次才会暴露（见 tools/dev/cardfight-shot.js）
  $("deck").classList.remove("gone");
  $("battle").classList.add("on");
  paintHud();
  await sleep(560);
  startRound();
}
$("goBtn").addEventListener("click", begin);
$("againBtn").addEventListener("click", () => {
  $("result").classList.remove("on");
  $("battle").classList.remove("on");
  $("opening").classList.remove("hide");
  $("deck").classList.add("gone");
  S = null;
});

/* 出错时把信息显示在页面上，别让玩家对着黑屏猜。
   另外挂一个**不显眼但可探测**的计数器：动画/异步流程出错时很容易被"看起来没事"掩盖，
   调试时（tools/dev/cardfight-shot.js）靠 window.__dbg 判断内部流程到底走到哪一步了。 */
window.__dbg = { flies: 0, flips: 0, rounds: 0, errors: [] };
/* 把当前状态挂到 window，供 tools/dev/cardfight-shot.js 判断"现在哪个阶段"。
   纯只读观测口，不参与游戏逻辑（无头脚本靠它决定"该抽牌还是该出牌"）。 */
window.S = S;
window.addEventListener("error", (e) => {
  const d = $("err");
  d.style.display = "block";
  d.textContent = "出错：" + (e.message || e.error);
  window.__dbg.errors.push(String(e.message || e.error));
});
window.addEventListener("unhandledrejection", (e) => {
  const d = $("err");
  d.style.display = "block";
  d.textContent = "异步出错：" + (e.reason && e.reason.message ? e.reason.message : e.reason);
  window.__dbg.errors.push(String(e.reason && e.reason.message ? e.reason.message : e.reason));
});
</script>
